<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX STUN Catalog</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    font-size:30px;
    letter-spacing:4px;
}

header p{
    margin-top:8px;
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 50px;
}

.search{
    margin-bottom:25px;
}

.search input{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    font-size:15px;
    box-shadow:0 2px 10px #0002;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    font-size:25px;
}

.title p{
    margin-top:7px;
    color:#777;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:30px 15px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 3px 12px #0001;
}

.card h3{
    font-size:18px;
}

.card p{
    color:#888;
    margin-top:7px;
    font-size:13px;
}

.back{
    display:inline-block;
    background:#111;
    color:white;
    padding:9px 15px;
    border-radius:7px;
    margin-bottom:20px;
    cursor:pointer;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 12px #0001;
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    font-size:17px;
}

.product-info p{
    color:#777;
    font-size:13px;
    margin-top:6px;
}

.price{
    font-size:19px;
    font-weight:bold;
    margin:10px 0;
}

.button{
    display:block;
    background:#111;
    color:white;
    text-align:center;
    padding:11px;
    border-radius:7px;
    text-decoration:none;
    margin-top:12px;
}

.detail{
    background:white;
    border-radius:12px;
    overflow:hidden;
}

.detail img{
    width:100%;
    max-height:550px;
    object-fit:cover;
}

.detail-content{
    padding:20px;
}

.detail-content h2{
    font-size:25px;
}

.detail-price{
    font-size:24px;
    font-weight:bold;
    margin:15px 0;
}

.row{
    padding:12px 0;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.row strong{
    display:inline-block;
    width:100px;
}

.hidden{
    display:none;
}

.loading{
    text-align:center;
    padding:50px;
    color:#777;
}

footer{
    background:#111;
    color:#888;
    text-align:center;
    padding:30px;
    font-size:12px;
}

@media(min-width:700px){

    .grid{
        grid-template-columns:repeat(4,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}
</style>
</head>

<body>

<header>
<h1>MAX STUN</h1>
<p>CAR BODYKIT CATALOG</p >
</header>

<div class="container">

<div class="search">
<input
id="search"
type="text"
placeholder="Search car model or product..."
oninput="searchProducts()">
</div>

<div id="home">

<div class="title">
<h2>Choose Your Car Brand</h2>
<p>Select a brand to explore our catalog</p >
</div>

<div id="brands" class="grid"></div>

</div>

<div id="models" class="hidden">

<div class="back" onclick="showHome()">← Back</div>

<div class="title">
<h2 id="modelTitle"></h2>
<p>Select your car model</p >
</div>

<div id="modelList" class="grid"></div>

</div>

<div id="years" class="hidden">

<div class="back" onclick="showModels()">← Back</div>

<div class="title">
<h2 id="yearTitle"></h2>
<p>Select vehicle year</p >
</div>

<div id="yearList" class="grid"></div>

</div>

<div id="productPage" class="hidden">

<div class="back" onclick="showYears()">← Back</div>

<div class="title">
<h2 id="productTitle"></h2>
<p>Select a product</p >
</div>

<div id="productList" class="products"></div>

</div>

<div id="detailPage" class="hidden">

<div class="back" onclick="backProducts()">← Back</div>

<div id="detail"></div>

</div>

</div>

<footer>
© 2026 MAX STUN CAR BODYKIT
<br><br>
Bodykit • Accessories • Installation
</footer><script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQXkOapQ7kcTayDEYr111yhO3zyF_DOvah2tDylOGNuoIt0FiSytpRKKJ5aHx0c3amj_wWexxF4Y_96/pub?output=csv";

const WHATSAPP_NUMBER = "60123456789";

let products = [];

let currentBrand = "";
let currentModel = "";
let currentYear = "";


/* LOAD GOOGLE SHEETS */

async function loadProducts(){

    const brands =
        document.getElementById("brands");

    brands.innerHTML =
        '<div class="loading">Loading catalog...</div>';

    try{

        const response =
            await fetch(SHEET_URL);

        const csv =
            await response.text();

        products =
            parseCSV(csv);

        products =
            products.filter(function(product){

                return product.Brand &&
                       product.Model &&
                       product.Product;

            });

        showBrands();

    }catch(error){

        console.log(error);

        brands.innerHTML =
            '<div class="loading">Unable to load catalog.</div>';

    }

}


/* CSV READER */

function parseCSV(text){

    const lines =
        text.trim().split(/\r?\n/);

    if(lines.length < 2){
        return [];
    }

    const headers =
        splitCSV(lines[0]);

    return lines.slice(1).map(function(line){

        const values =
            splitCSV(line);

        const item = {};

        headers.forEach(function(header,index){

            item[header.trim()] =
                values[index] || "";

        });

        return item;

    });

}


function splitCSV(line){

    const result = [];

    let current = "";

    let quotes = false;


    for(let i=0;i<line.length;i++){

        const char = line[i];

        if(char === '"'){

            quotes = !quotes;

        }

        else if(char === "," && !quotes){

            result.push(current.trim());

            current = "";

        }

        else{

            current += char;

        }

    }

    result.push(current.trim());

    return result;

}


/* HIDE ALL PAGES */

function hideAll(){

    document
    .getElementById("home")
    .classList.add("hidden");

    document
    .getElementById("models")
    .classList.add("hidden");

    document
    .getElementById("years")
    .classList.add("hidden");

    document
    .getElementById("productPage")
    .classList.add("hidden");

    document
    .getElementById("detailPage")
    .classList.add("hidden");

}


/* SHOW BRANDS */

function showBrands(){

    hideAll();

    document
    .getElementById("home")
    .classList.remove("hidden");


    const brandList =
        document.getElementById("brands");


    const brands =
        [...new Set(

            products.map(function(product){

                return product.Brand;

            })

        )];


    brandList.innerHTML = "";


    brands.forEach(function(brand){

        brandList.innerHTML += `

        <div
        class="card"
        onclick="selectBrand('${escapeText(brand)}')">

            <h3>${brand}</h3>

            <p>View Models</p >

        </div>

        `;

    });

}


/* SELECT BRAND */

function selectBrand(brand){

    currentBrand = brand;

    hideAll();

    document
    .getElementById("models")
    .classList.remove("hidden");


    document
    .getElementById("modelTitle")
    .innerText = brand;


    const models =
        [...new Set(

            products
            .filter(function(product){

                return product.Brand === brand;

            })
            .map(function(product){

                return product.Model;

            })

        )];


    const list =
        document.getElementById("modelList");


    list.innerHTML = "";


    models.forEach(function(model){

        list.innerHTML += `

        <div
        class="card"
        onclick="selectModel('${escapeText(model)}')">

            <h3>${model}</h3>

            <p>View Years</p >

        </div>

        `;

    });

}


/* SELECT MODEL */

function selectModel(model){

    currentModel = model;

    hideAll();

    document
    .getElementById("years")
    .classList.remove("hidden");


    document
    .getElementById("yearTitle")
    .innerText =
        currentBrand + " " + model;


    const years =
        [...new Set(

            products
            .filter(function(product){

                return product.Brand === currentBrand &&
                       product.Model === currentModel;

            })
            .map(function(product){

                return product.Year;

            })

        )];


    const list =
        document.getElementById("yearList");


    list.innerHTML = "";


    years.forEach(function(year){

        list.innerHTML += `

        <div
        class="card"
        onclick="selectYear('${escapeText(year)}')">

            <h3>${year}</h3>

            <p>View Products</p >

        </div>

        `;

    });

}


/* SELECT YEAR */

function selectYear(year){

    currentYear = year;

    hideAll();

    document
    .getElementById("productPage")
    .classList.remove("hidden");


    document
    .getElementById("productTitle")
    .innerText =
        currentBrand +
        " " +
        currentModel +
        " • " +
        year;


    showProductList();

}function showProductList(){

    const list =
        document.getElementById("productList");

    list.innerHTML = "";


    const filtered =
        products.filter(function(product){

            return product.Brand === currentBrand &&
                   product.Model === currentModel &&
                   product.Year === currentYear;

        });


    if(filtered.length === 0){

        list.innerHTML =
            '<div class="loading">No products found.</div>';

        return;

    }


    filtered.forEach(function(product){

        const index =
            products.indexOf(product);


        list.innerHTML += `

        <div class="product">

            ${
                product.Image
                ?
                `<img
                    src="${product.Image}"
                    alt="${product.Product}">
                `
                :
                `<div
                    style="
                    height:190px;
                    background:#ddd;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#888;">
                    No Image
                </div>`
            }


            <div class="product-info">

                <h3>
                    ${product.Product}
                </h3>


                ${
                    product.Category
                    ?
                    `<p>${product.Category}</p >`
                    :
                    ""
                }


                ${
                    product.Price
                    ?
                    `<div class="price">
                        ${product.Price}
                    </div>`
                    :
                    ""
                }


                <a
                    href=" "
                    class="button"
                    onclick="
                    showProduct(${index});
                    return false;">

                    View Details

                </a >

            </div>

        </div>

        `;

    });

}


/* SHOW PRODUCT DETAIL */

function showProduct(index){

    const product =
        products[index];


    hideAll();


    document
    .getElementById("detailPage")
    .classList.remove("hidden");


    const message =
        "Hi MAX STUN, I am interested in " +
        product.Product +
        " for " +
        product.Brand +
        " " +
        product.Model +
        ".";


    const whatsapp =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    document
    .getElementById("detail")
    .innerHTML = `

        ${
            product.Image
            ?
            `<img
                src="${product.Image}"
                alt="${product.Product}">
            `
            :
            ""
        }


        <div class="detail-content">

            <h2>
                ${product.Product}
            </h2>


            ${
                product.Price
                ?
                `<div class="detail-price">
                    ${product.Price}
                </div>`
                :
                ""
            }


            ${
                product.Category
                ?
                `<div class="row">
                    <strong>Category:</strong>
                    ${product.Category}
                </div>`
                :
                ""
            }


            ${
                product.Brand
                ?
                `<div class="row">
                    <strong>Brand:</strong>
                    ${product.Brand}
                </div>`
                :
                ""
            }


            ${
                product.Model
                ?
                `<div class="row">
                    <strong>Model:</strong>
                    ${product.Model}
                </div>`
                :
                ""
            }


            ${
                product.Year
                ?
                `<div class="row">
                    <strong>Year:</strong>
                    ${product.Year}
                </div>`
                :
                ""
            }


            ${
                product.Material
                ?
                `<div class="row">
                    <strong>Material:</strong>
                    ${product.Material}
                </div>`
                :
                ""
            }


            ${
                product.Installation
                ?
                `<div class="row">
                    <strong>Installation:</strong>
                    ${product.Installation}
                </div>`
                :
                ""
            }


            ${
                product.Description
                ?
                `<div class="row">
                    <strong>Details:</strong>
                    ${product.Description}
                </div>`
                :
                ""
            }


            <a
                href="${whatsapp}"
                target="_blank"
                class="button">

                WhatsApp Us

            </a >

        </div>

    `;

}


/* SEARCH */

function searchProducts(){

    const keyword =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if(keyword === ""){

        showHome();

        return;

    }


    hideAll();


    document
    .getElementById("productPage")
    .classList.remove("hidden");


    document
    .getElementById("productTitle")
    .innerText =
        "Search Results";


    const list =
        document.getElementById("productList");


    list.innerHTML = "";


    const results =
        products.filter(function(product){

            const text =
                (
                    product.Brand +
                    " " +
                    product.Model +
                    " " +
                    product.Year +
                    " " +
                    product.Product +
                    " " +
                    product.Category
                ).toLowerCase();


            return text.includes(keyword);

        });


    if(results.length === 0){

        list.innerHTML =
            '<div class="loading">No products found.</div>';

        return;

    }


    results.forEach(function(product){

        const index =
            products.indexOf(product);


        list.innerHTML += `

        <div class="product">

            ${
                product.Image
                ?
                `<img
                    src="${product.Image}"
                    alt="${product.Product}">
                `
                :
                ""
            }


            <div class="product-info">

                <h3>
                    ${product.Product}
                </h3>


                <p>
                    ${product.Brand}
                    ${product.Model}
                </p >


                ${
                    product.Price
                    ?
                    `<div class="price">
                        ${product.Price}
                    </div>`
                    :
                    ""
                }


                <a
                    href="#"
                    class="button"
                    onclick="
                    showProduct(${index});
                    return false;">

                    View Details

                </a >

            </div>

        </div>

        `;

    });

}


/* BACK BUTTONS */

function showHome(){

    document
    .getElementById("search")
    .value = "";

    showBrands();

}


function showModels(){

    selectBrand(currentBrand);

}


function showYears(){

    selectModel(currentModel);

}


function backProducts(){

    selectYear(currentYear);

}


/* SAFE TEXT */

function escapeText(text){

    return String(text)
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"');

}


/* START WEBSITE */

loadProducts();

</script>

</body>
</html>
